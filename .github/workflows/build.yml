name: Build Shizuku API

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Shizuku API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;23.0.7599858"

      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
          test -f "$ANDROID_SDK_ROOT/build-tools/30.0.3/aapt"
          test -d "$ANDROID_SDK_ROOT/ndk/23.0.7599858"
          echo "Android SDK OK"
          echo "NDK OK"

      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build API
        run: |
          ./gradlew --no-daemon --stacktrace \
            :api:assembleRelease \
            :provider:assembleRelease

      - name: Find AAR
        run: |
          echo "===== AAR FILES ====="
          find . -type f -name "*.aar" -print

      - name: Package AAR
        run: |
          set -e

          mkdir -p release

          find api/build/outputs -type f -name "*.aar" \
            -exec cp {} release/ \;

          find provider/build/outputs -type f -name "*.aar" \
            -exec cp {} release/ \;

          echo "===== RELEASE FILES ====="
          ls -lh release/

          test "$(find release -type f -name "*.aar" | wc -l)" -gt 0

          cd release
          zip -9 ../shizuku-api-release.zip *.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-api-release
          path: |
            release/*.aar
            shizuku-api-release.zip
          if-no-files-found: error
          retention-days: 30