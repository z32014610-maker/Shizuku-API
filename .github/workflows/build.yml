name: Build Shizuku API

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
          sdkmanager "ndk;23.0.7599858"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :api:assembleRelease :provider:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-api-release
          path: |
            api/build/outputs/**/*.aar
            provider/build/outputs/**/*.aar