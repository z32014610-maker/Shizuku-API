name: Build Shizuku API

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" ]; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          fi

          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3"

      - name: Install NDK
        run: |
          sdkmanager "ndk;23.0.7599858"

      - name: Check Android environment
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "SDK Manager:"
          sdkmanager --version

          echo "Platform:"
          ls "$ANDROID_SDK_ROOT/platforms/android-30"

          echo "Build Tools:"
          ls "$ANDROID_SDK_ROOT/build-tools/30.0.3"

          echo "NDK:"
          ls "$ANDROID_SDK_ROOT/ndk/23.0.7599858"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Shizuku API
        run: |
          ./gradlew --no-daemon :api:assembleRelease :provider:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-api-release
          path: |
            api/build/outputs/**/*.aar
            provider/build/outputs/**/*.aar
          if-no-files-found: error