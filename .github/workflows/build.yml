name: Build Shizuku API

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.3"

      - name: Install NDK
        run: |
          sdkmanager "ndk;23.0.7599858"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.0.7599858" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=23.0.7599858" >> $GITHUB_ENV

      - name: Check environment
        run: |
          java -version
          sdkmanager --version
          ls -la "$ANDROID_SDK_ROOT/ndk/23.0.7599858"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Shizuku API
        run: |
          ./gradlew --no-daemon :api:assembleRelease :provider:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-api-release
          path: |
            api/build/outputs/**/*.aar
            provider/build/outputs/**/*.aar
          if-no-files-found: error